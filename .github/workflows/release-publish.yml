name: Publish Release

on:
  push:
    tags:
      - 'v*'
  # release-cut.yml pushes the version tag using GITHUB_TOKEN, and GitHub
  # deliberately does not let that token trigger further workflows. So the push
  # trigger above never fires for a cut release: you get a tag and no release,
  # silently. Dispatch this at the tag ref to publish it:
  #
  #   gh workflow run release-publish.yml --ref vX.Y.Z
  #
  # The alternative fix -- having release-cut push with a PAT -- was not taken:
  # it would widen that workflow's credentials to make an event fire, where this
  # only adds a manual path for the case the automatic one cannot cover.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      # Everything below derives the release from GITHUB_REF_NAME, so a
      # dispatch at a branch ref would try to publish a release named after the
      # branch. Fail immediately and say why.
      - name: Require a tag ref
        run: |
          [[ $GITHUB_REF == refs/tags/v* ]] || {
            echo "::error::release-publish must run at a version tag ref, got '$GITHUB_REF'." >&2
            echo "::error::Dispatch it with: gh workflow run release-publish.yml --ref vX.Y.Z" >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: fisherman/go.mod
          cache: true
          cache-dependency-path: fisherman/go.sum
      - name: Run tests before publishing
        run: sudo go test -race ./...
        working-directory: fisherman
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
      - name: Build and upload draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          repo=$GITHUB_REPOSITORY
          [[ $repo == frostyard/fisherman ]] || {
            echo "::error::unexpected release repository: $repo" >&2
            exit 1
          }

          release_json=$(gh release view "$tag" --repo "$repo" --json isDraft,assets)
          jq -e '.isDraft == true' <<<"$release_json" >/dev/null || {
            echo "::error::release is not a draft before verification" >&2
            exit 1
          }

          raw_assets=(
            "fisherman_${version}_linux_amd64"
            "fisherman_${version}_linux_arm64"
          )
          archive_assets=(
            "fisherman_${version}_linux_amd64.tar.gz"
            "fisherman_${version}_linux_arm64.tar.gz"
          )
          for name in "${raw_assets[@]}" "${archive_assets[@]}" checksums.txt; do
            jq -e --arg name "$name" '[.assets[] | select(.name == $name)] | length == 1' \
              <<<"$release_json" >/dev/null || {
                echo "::error::missing or duplicate remote release asset: $name" >&2
                exit 1
              }
          done

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          gh release download "$tag" --repo "$repo" --pattern checksums.txt --dir "$tmpdir"
          for name in "${raw_assets[@]}" "${archive_assets[@]}"; do
            grep -Eq "^[0-9a-f]{64}  ${name}$" "$tmpdir/checksums.txt" || {
              echo "::error::missing remote checksum entry: $name" >&2
              exit 1
            }
          done

          gh release edit "$tag" --repo "$repo" --draft=false
          gh release view "$tag" --repo "$repo" --json isDraft --jq \
            'if .isDraft then error("release remained a draft") else "published verified release" end'
