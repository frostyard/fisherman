name: CI matrix

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22.x', stable]
    defaults:
      run:
        working-directory: fisherman
    steps:
      - uses: actions/checkout@v4
      - name: Validate ACMM quality-gate artifacts
        run: tests/check-acmm-artifacts.sh
        working-directory: .
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: fisherman/go.sum
      - name: Build
        run: go build ./cmd/fisherman
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
