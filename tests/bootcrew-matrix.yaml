# Fisherman CI regression test matrix.
# Used by bootcrew-vm.yml (PR gate, VM boot) and bootcrew-nightly.yml (full
# install). Add new images here; the workflows pick them up automatically.
#
# vm_boot: true  — include in bootcrew-vm.yml E2E VM boot tests on every PR
#          false — skip in VM boot (reserved for nightly)
# required: true — failure fails the workflow. Reserve for canaries that
#          exercise an install backend Frostyard actually ships.
#          Everything else runs advisory: failures appear in the job summary
#          without failing the workflow.
#
# Scope note (2026-08-05): this matrix previously carried the upstream fork's
# images — bootcrew, tuna-os, ublue, centos and projectbluefin — none of which
# Frostyard ships. They are removed. Their practical effect had become negative:
# the advisory legs failed persistently on SSH timeouts, and a check that is
# always red carries no information, so nobody read it.
#
# Consequences worth knowing:
#   - The ostree + grub2 canary (centos-bootc) is gone. Frostyard installs are
#     composefs + systemd-boot everywhere, so nothing shipped exercises that
#     backend. Fisherman still SUPPORTS it; it is simply no longer covered here.
#     Re-add a canary if that support is meant to stay guaranteed.
#   - The old required canary named "dakota" pulled ghcr.io/projectbluefin/dakota,
#     which is upstream Bluefin's image, not Frostyard's Dakota installer media.
#     Frostyard's Dakota ISO is built from Snow, so frostyard-snow is the
#     equivalent canary.
#
# These entries use the :mechanics tags, NOT :latest, and that is a hard
# requirement rather than a preference. A secure (:latest) image ships a
# MOK-signed UKI with composefs= baked in, pinned to the digest of the exact
# image it was assembled from. This harness derives an SSH-enabled variant of
# every vm_boot image so it can log in and verify the boot -- and that
# derivation changes the composefs digest, so bootc refuses the signed UKI:
#
#   Setting up UKI boot: The UKI has the wrong composefs= parameter
#   (is 'sha512:c598f2e1...', should be 'sha512:b507c1e4...')
#
# That refusal is the security property working, not a defect: a secure image
# is not derivable, on purpose. Mechanics images carry no signed UKI binding,
# which is exactly why they exist. Install MECHANICS is what this matrix tests;
# the secure path is covered by snosi's Task 9 harness, which installs the
# unmodified signed image through the real Dakota media.
#
# Do not "fix" a future UKI mismatch here by switching back to :latest.
images:
  # Composefs + systemd-boot canary, and the payload Frostyard's Dakota
  # installer media is built from.
  - name: frostyard-snow
    image: ghcr.io/frostyard/snow:mechanics
    filesystem: btrfs
    btrfs_subvolumes: true
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true
    required: true
    build_ssh_image: true

  # Server product. Same backend, much smaller, so it is the cheap early
  # signal when something backend-level breaks.
  - name: frostyard-cayo
    image: ghcr.io/frostyard/cayo:mechanics
    filesystem: btrfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true
    build_ssh_image: true

  # btrfs subvolumes + composefs + systemd-boot + no encryption. Regression
  # coverage for #32: SetupBtrfsSubvolumes mounts the root as subvol=@ so bootc
  # writes the deployment into @/state/deploy, but the composefs GPT-retag path
  # used to remount the root bare, exposing the btrfs top-level (@, @home,
  # @snapshots) instead of @. Post-install (hostname, flatpaks) then failed with
  # "finding composefs deploy etc … state/deploy: no such file or directory",
  # aborting at 99%. Setting @ as the btrfs default subvolume additionally
  # ensures systemd GPT auto-discovery mounts @ at first boot rather than the
  # top-level. Advisory (no `required`) on the small cayo image; the VM boot is
  # the signal that @ selection at boot actually works.
  - name: frostyard-cayo-btrfs-subvol
    image: ghcr.io/frostyard/cayo:mechanics
    ssh_image_name: frostyard-cayo
    filesystem: btrfs
    btrfs_subvolumes: true
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true
    # Exercised by bootcrew-vm.yml's full install+boot harness (bootcrew-ci-test,
    # which plumbs btrfsSubvolumes and mounts subvol=@ for verification). The
    # lighter bootcrew-nightly.yml inline verify assumes a 3-partition GRUB
    # layout (p3 root) and bare-mounts the root, which neither matches this
    # systemd-boot 2-partition layout nor the @ subvolume, so keep it out of
    # nightly.
    nightly: false

  # ext4 + composefs. btrfs is what Frostyard installs default to and what the
  # other three entries cover, so this is the only leg that exercises
  # FormatRoot's ext4 branch — and that branch is not a trivial variation:
  #
  #   mkfs.ext4 -F -L root -O verity <dev>
  #
  # composefs needs FS_IOC_ENABLE_VERITY per file, and ext4 only offers it when
  # the verity feature is set at format time. Drop that one flag and the install
  # still succeeds; the deployment then fails to boot. Nothing else in CI would
  # notice. Keep this entry for as long as fisherman claims ext4 support.
  #
  # Advisory (no `required`) and on cayo rather than snow: cayo is the small
  # image, so this is the cheap way to hold the coverage.
  - name: frostyard-cayo-ext4
    image: ghcr.io/frostyard/cayo:mechanics
    ssh_image_name: frostyard-cayo
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true

  # LUKS + composefs + btrfs. This replaces the dakota-luks / dakota-luks-btrfs
  # entries and is not optional coverage: it is exactly the shape the snosi
  # secure install produces (encrypted root, composefs backend, systemd-boot),
  # so it is the closest CI analogue to the production secure path.
  - name: frostyard-snow-luks
    image: ghcr.io/frostyard/snow:mechanics
    ssh_image_name: frostyard-snow
    filesystem: btrfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "fisherman-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # frostyard-snowloaded disabled: the image bundles an older libostree built
  # without composefs support, while the Ubuntu 24.04 runner has the composefs
  # kernel module loaded. libostree sees composefs available at runtime, tries
  # to use it, and fails with "composefs: enabled at runtime, but support is
  # not compiled in". Re-enable once the image ships a libostree with composefs
  # compiled in.
  # - name: frostyard-snowloaded
  #   image: ghcr.io/frostyard/snowloaded:latest
  #   filesystem: xfs
  #   composefs_backend: false
  #   unified_storage: false
  #   selinux_disabled: false
