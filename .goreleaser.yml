version: 2

builds:
  - id: fisherman
    dir: fisherman
    main: ./cmd/fisherman
    binary: fisherman
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: fisherman
    name_template: "fisherman_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary
      - tar.gz
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: frostyard
    name: fisherman
  draft: true
  replace_existing_draft: true
  prerelease: auto
  header: |
    ## fisherman {{ .Tag }}

    A composefs-native bootc installer.
